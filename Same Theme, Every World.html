<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Same Theme, Every World</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap">
<style>
:root{--bg:#f4f5f7;--surface:#fff;--ink:#14171f;--sub:#6a7080;--line:#dfe2e8;--t:#1a1d24;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--surface:#181b22;--ink:#eceef3;--sub:#9096a6;--line:#2a2e38}}
:root[data-theme="dark"]{--bg:#0f1115;--surface:#181b22;--ink:#eceef3;--sub:#9096a6;--line:#2a2e38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans","Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
.hero{background:var(--t);color:#fff;padding:44px 20px 40px;transition:background .35s}
.wrap{max-width:720px;margin:0 auto}
.hero p{margin:0;font-size:13px;font-weight:600;opacity:.8}
.hero p:empty{display:none}
.hero #tNote.big{font-size:clamp(18px,5vw,26px);font-weight:600;opacity:.9;letter-spacing:-.01em}
.hero #tSub{font-size:clamp(18px,5vw,26px);font-weight:600;opacity:.9;letter-spacing:-.01em}
.hero #tNote{font-weight:400;max-width:34em}
.hero h1{margin:14px 0 16px;font:300 clamp(34px,9vw,58px)/1.15 "Nunito Sans","Zen Kaku Gothic New",sans-serif;letter-spacing:-.03em}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;max-width:720px;margin:0 auto;scrollbar-width:none}
.tab{flex:none;border:0;background:none;color:var(--sub);font:500 14px inherit;font-family:inherit;padding:13px 10px;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--t)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--t);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:16px 12px 40px}
.form{display:grid;gap:10px;background:var(--surface);border-radius:10px;padding:14px;margin-bottom:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=text]{font:inherit;width:100%;border:0;border-bottom:1.5px solid var(--line);background:transparent;color:var(--ink);padding:9px 2px;border-radius:0}
input[type=text]::placeholder{color:var(--sub)}
.btn{font:700 15px inherit;font-family:inherit;border:0;border-radius:8px;padding:12px;cursor:pointer;background:var(--t);color:#fff;width:100%}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
#preview{width:100%;max-height:260px;object-fit:cover;border-radius:8px;display:none}
#msg{font-size:13px;color:var(--sub);min-height:1em}
#msg.err{color:#d33}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px 8px}
.grid.feed{grid-template-columns:1fr;gap:28px;max-width:460px;margin:0 auto}
.post{position:relative}
.post img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:6px;background:var(--line)}
.feed .post img{aspect-ratio:auto;max-height:640px}
.c{margin:8px 0 2px;font-size:15px;word-break:break-word}
.m{font-size:12px;color:var(--sub)}
.m b{color:var(--ink);font-weight:700}
.tag{color:var(--tc,var(--sub));font-weight:700}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:2px 8px}
.empty{text-align:center;color:var(--sub);padding:48px 16px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
@media (prefers-reduced-motion:reduce){.hero{transition:none}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <p id="tSub"></p>
  <h1 id="tTitle"></h1>
  <p id="tNote"></p>
</div></header>
<nav class="nav"><div class="tabs" id="themes"></div></nav>
<main>
  <section class="form" id="form">
    <div class="row">
      <button class="btn" id="cam" type="button">今、撮る</button>
      <button class="btn alt" id="pick" type="button">アルバムから</button>
    </div>
    <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
    <input type="file" id="file" accept="image/*" hidden>
    <img id="preview" alt="選んだ写真">
    <input type="text" id="comment" maxlength="50" placeholder="ひとこと（50文字まで）">
    <div class="row">
      <input type="text" id="name" maxlength="20" placeholder="ニックネーム">
      <input type="text" id="place" maxlength="24" placeholder="どこから？ 例: Kyoto, JP">
    </div>
    <button class="btn" id="send" disabled>投稿する</button>
    <div id="msg"></div>
  </section>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"><b>まだ1枚もありません</b>このテーマの最初の1枚を撮ってみましょう。</div>
</main>
<script>
const THEMES=[
 {id:"morning",t:"朝の光",e:"Morning light",c:"#b86e00"},
 {id:"window",t:"窓の外",e:"View from your window",c:"#2f6fb3"},
 {id:"lunch",t:"今日のごはん",e:"What's on your plate",c:"#c8402f"},
 {id:"blue",t:"青いもの",e:"Something blue",c:"#1f4fd8"},
 {id:"small",t:"小さな幸せ",e:"A small joy",c:"#bd3f77"},
 {id:"street",t:"帰り道",e:"The way home",c:"#5b3fa8"}
];
let cur="all", db=null, unsub=null, blob=null, live=false;
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)||""}catch(e){return""}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
$("name").value=store.get("name");$("place").value=store.get("place");

function renderThemes(){
  const box=$("themes");box.textContent="";
  [{id:"all",t:"フィード"},...THEMES].forEach(th=>{
    const b=document.createElement("button");b.className="tab"+(th.id===cur?" on":"");b.textContent=th.t;
    b.onclick=()=>{cur=th.id;renderThemes();subscribe()};box.appendChild(b);
  });
  const all=cur==="all",th=THEMES.find(x=>x.id===cur);
  $("tTitle").textContent=all?"New posts":th.t;
  $("tSub").textContent=all?"":th.e;
  $("tNote").textContent=all?"Somewhere in the world":"世界中の人が、同じテーマで撮っています。";
  document.documentElement.style.setProperty("--t",all?"#1a1d24":th.c);
  $("tNote").className=all?"big":"";
  $("form").style.display=all?"none":"grid";
  $("grid").className=all?"grid feed":"grid";
}

function resize(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,720/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.72))};
  img.onerror=rej;img.src=u;
})}
function say(t,err){const m=$("msg");m.textContent=t;m.className=err?"err":""}

$("cam").onclick=()=>$("fileCam").click();
$("pick").onclick=()=>$("file").click();
$("fileCam").onchange=e=>onFile(e,true);
$("file").onchange=e=>onFile(e,false);
async function onFile(e,isLive){
  const f=e.target.files[0];if(!f)return;
  try{live=isLive;blob=await resize(f);$("preview").src=blob;$("preview").style.display="block";$("send").disabled=!db}
  catch(err){say("画像を読み込めませんでした。別の写真を選んでください。",true)}
}

$("send").onclick=async()=>{
  if(!blob||!db||cur==="all")return;
  const name=$("name").value.trim()||"Anonymous",place=$("place").value.trim();
  store.set("name",name);store.set("place",place);
  $("send").disabled=true;say("投稿しています…");
  try{
    await db.collection("posts").add({theme:cur,img:blob,comment:$("comment").value.trim().slice(0,50),name,place,at:Date.now(),live});
    blob=null;live=false;$("file").value="";$("fileCam").value="";$("preview").style.display="none";$("comment").value="";say("投稿しました");
  }catch(err){say("投稿できませんでした。権限か容量の上限を確認してください。",true);$("send").disabled=false}
};

function subscribe(){
  if(!db)return;if(unsub)unsub();
  const base=db.collection("posts");
  unsub=(cur==="all"?base:base.where("theme","==",cur)).orderBy("at","desc").limit(60).onSnapshot(snap=>{
    const g=$("grid");g.textContent="";
    snap.docs.forEach(d=>{
      const p=d.data();const el=document.createElement("article");el.className="post";
      const im=document.createElement("img");im.src=String(p.img||"");im.alt=p.comment||"投稿写真";im.loading="lazy";
      const c=document.createElement("p");c.className="c";c.textContent=p.comment||"";
      const m=document.createElement("div");m.className="m";
      if(cur==="all"){const t=THEMES.find(x=>x.id===p.theme);if(t){const tg=document.createElement("span");tg.className="tag";tg.style.setProperty("--tc",t.c);tg.textContent=t.t+"  ";m.appendChild(tg)}}
      const nm=document.createElement("b");nm.textContent=p.name||"Anonymous";
      m.append(nm,(p.place?"  "+p.place:"")+"  "+new Date(p.at).toLocaleDateString());
      el.append(im);
      if(p.live){const bd=document.createElement("span");bd.className="badge";bd.textContent="NOW";el.appendChild(bd)}
      el.append(c,m);g.appendChild(el);
    });
    $("empty").style.display=snap.docs.length?"none":"block";
  },()=>say("読み込めませんでした。しばらくしてから再読み込みしてください。",true));
}

renderThemes();
(async()=>{
  try{db=await claude.use("db")}catch(e){db=null}
  if(!db){say("このビューでは投稿を保存できません（閲覧のみ）",true);$("empty").style.display="block";return}
  subscribe();$("send").disabled=!blob;
})();
</script>
</body>
</html>
